name: Backup criptografado da clinica
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'
permissions:
  contents: read
concurrency:
  group: backup-clinica
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.BACKUP_ATIVO == 'sim')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preparar ferramentas
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | grep -q 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/clinica-pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18
          python3 -m venv /tmp/backup-env
          /tmp/backup-env/bin/pip install cryptography==50.0.2
      - name: Exportar, criptografar e conferir no Drive
        id: backup_verified
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
          DRIVE_AUTH_ENCRYPTED: ${{ secrets.DRIVE_AUTH_ENCRYPTED }}
          DRIVE_AUTH_PASSWORD: ${{ secrets.DRIVE_AUTH_PASSWORD }}
        run: |
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          /tmp/backup-env/bin/python scripts/backup_nuvem.py
      - name: Confirmar backup no monitor externo
        if: ${{ success() && steps.backup_verified.outcome == 'success' }}
        timeout-minutes: 2
        env:
          BACKUP_HEALTHCHECK_URL: ${{ secrets.BACKUP_HEALTHCHECK_URL }}
        run: python3 scripts/notificar_backup.py
